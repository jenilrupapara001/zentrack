version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: pr-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: payment_reconciliation

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pr-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb+srv://jenil:jenilpatel@aiap.sedzp3h.mongodb.net/payment_reconciliation?retryWrites=true&w=majority&appName=payment_reconciliation
      SESSION_SECRET: change-me-to-a-long-random-string
      ADMIN_PASSWORD: Password
      EMAIL_UPLOAD_PASSWORD: Payment Mail Sender Dashboard
      CLIENT_URL: https://zentrack-alpha.vercel.app
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: https://zentrack-pkos.onrender.com
    depends_on:
      - backend

volumes:
  mongo-data:
