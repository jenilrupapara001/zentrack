version: '3.8'

services:
  # Local MongoDB node (for offline development)
  mongo:
    image: mongo:7
    container_name: pr-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: payment_reconciliation

  # Global Backend Platform
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pr-backend
    restart: unless-stopped
    ports:
      # Adjusted to match the High-Fidelity ZenTrack port (5002)
      - "5002:5002"
    environment:
      # Use 5002 inside and outside for consistency
      PORT: 5002
      # Priority 1: Use your production Atlas URI (Current configuration)
      # Priority 2: Use local 'mongo' service during cluster testing
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://jenil:jenilpatel@aiap.sedzp3h.mongodb.net/payment_reconciliation?retryWrites=true&w=majority&appName=payment_reconciliation}
      SESSION_SECRET: ${SESSION_SECRET:-enterprise-reconciliation-vault-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      CLIENT_URL: https://zentrack-alpha.vercel.app
    depends_on:
      - mongo

  # Public-Facing Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Point to the Production API Console
      VITE_API_BASE_URL: https://zentrack-pkos.onrender.com/api
    depends_on:
      - backend

volumes:
  mongo-data:
